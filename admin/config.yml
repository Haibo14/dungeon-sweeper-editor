  - name: "potions"
    label: "Potions"
    label_singular: "Potion"
    description: "Potions du jeu : un fichier JSON par potion (format : docs/data.md du dépôt du jeu). Une nouvelle potion n'apparaît que dans les coffres des étages qui la listent : l'ajouter aux choix de « Potion » des étages dans config.yml."
    folder: "data/potions"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    fields:
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'une nouvelle potion (« Potion verte » → potion_verte.json)."
      - name: "texture"
        label: "Icône"
        widget: "image"
        required: false
        media_folder: "/assets/ui"
        public_folder: "/assets/ui"
        choose_url: false
        accept: "image/png"
        hint: "Image de assets/ui/ (red_potion, blue_potion). Une nouvelle image s'ajoute dans le dépôt du jeu avec sa fiche .md (docs/assets.md), pas ici."
      - name: "heal"
        label: "Soin"
        widget: "number"
        value_type: "int"
        min: 0
        max: 99
        step: 1
        required: false
        hint: "PV rendus, sans dépasser le maximum (1 = un demi-cœur). Vide = 0."
      - name: "shield"
        label: "Bouclier durable"
        widget: "number"
        value_type: "int"
        min: 0
        max: 99
        step: 1
        required: false
        hint: "Points de bouclier durable donnés : ils restent jusqu'à ce que des dégâts les usent. Vide = 0."
      - name: "gold_value"
        label: "Valeur en or"
        widget: "number"
        value_type: "int"
        min: 0
        max: 9999
        step: 1
        required: false
        hint: "Le marchand la vend à cette valeur × le multiplicateur de prix de l'étage. Vide = 10."
  - name: "prices"
    label: "Prix"
