# Sveltia CMS - données d'équilibrage de DungeonSweeper (armes uniquement).
# Champs tirés des JSON Schema du dépôt du jeu (schema/). Ne contient aucune donnée de jeu.
backend:
  name: "github"
  repo: "Haibo14/DungeonSweeper"
  branch: "balance"
media_folder: "assets/import"
public_folder: "/assets/import"
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "_"
output:
  omit_empty_optional_fields: true
  json:
    indent_style: "space"
    indent_size: 2
collections:
  - name: "weapons"
    label: "Armes"
    label_singular: "Arme"
    description: "Armes du jeu : un fichier JSON par arme (format : docs/data.md du dépôt du jeu)."
    folder: "data/equipment/weapons"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    sortable_fields:
      fields:
        - "display_name"
        - "category"
        - "rarity"
      default:
        field: "category"
        direction: "ascending"
    view_filters:
      filters:
        - name: "category_other"
          label: "Type : Autre"
          field: "category"
          eq: "OTHER"
        - name: "category_sword"
          label: "Type : Épée"
          field: "category"
          eq: "SWORD"
        - name: "category_rapier"
          label: "Type : Rapière"
          field: "category"
          eq: "RAPIER"
        - name: "category_flail"
          label: "Type : Fléau"
          field: "category"
          eq: "FLAIL"
        - name: "category_shuriken"
          label: "Type : Shuriken"
          field: "category"
          eq: "SHURIKEN"
        - name: "category_bow"
          label: "Type : Arc"
          field: "category"
          eq: "BOW"
        - name: "category_crossbow"
          label: "Type : Arbalète"
          field: "category"
          eq: "CROSSBOW"
        - name: "category_parrying_dagger"
          label: "Type : Dague de parade"
          field: "category"
          eq: "PARRYING_DAGGER"
        - name: "category_javelin"
          label: "Type : Javelot"
          field: "category"
          eq: "JAVELIN"
        - name: "category_claw"
          label: "Type : Griffe"
          field: "category"
          eq: "CLAW"
        - name: "category_axe"
          label: "Type : Hache"
          field: "category"
          eq: "AXE"
        - name: "category_hammer"
          label: "Type : Marteau"
          field: "category"
          eq: "HAMMER"
        - name: "category_estoc"
          label: "Type : Estoc"
          field: "category"
          eq: "ESTOC"
        - name: "category_katana"
          label: "Type : Katana"
          field: "category"
          eq: "KATANA"
        - name: "category_shield"
          label: "Type : Bouclier"
          field: "category"
          eq: "SHIELD"
        - name: "rarity_r0_common"
          label: "Rareté : Commun"
          field: "rarity"
          eq: "R0_COMMON"
        - name: "rarity_r1_uncommon"
          label: "Rareté : Peu commun"
          field: "rarity"
          eq: "R1_UNCOMMON"
        - name: "rarity_r2_rare"
          label: "Rareté : Rare"
          field: "rarity"
          eq: "R2_RARE"
        - name: "rarity_r3_epic"
          label: "Rareté : Épique"
          field: "rarity"
          eq: "R3_EPIC"
        - name: "rarity_r4_legendary"
          label: "Rareté : Légendaire"
          field: "rarity"
          eq: "R4_LEGENDARY"
    view_groups:
      groups:
        - name: "category"
          label: "Type"
          field: "category"
        - name: "rarity"
          label: "Rareté"
          field: "rarity"
    fields:
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'une nouvelle arme (« Hache de guerre » → hache_de_guerre.json)."
      - name: "texture"
        label: "Icône"
        widget: "image"
        required: false
        media_folder: "/assets/icons/weapons"
        public_folder: "/assets/icons/weapons"
        choose_url: false
        accept: "image/png"
        hint: "Une des 720 icônes de assets/icons/weapons/ (<famille>_<matériau>, découpées des atlas par build_weapon_icons.gd). Ne pas en ajouter ici : elles viennent des atlas."
      - name: "effects"
        label: "Effets de l'objet"
        label_singular: "Effet"
        widget: "list"
        required: false
        hint: "Pas encore appliqués en jeu : laisser vide."
        typeKey: "type"
        types:
          - name: "DamageEffect"
            label: "Dégâts"
            widget: "object"
            hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "HealEffect"
            label: "Soin"
            widget: "object"
            hint: "Rend des PV au porteur, sans dépasser son maximum."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "StrengthEffect"
            label: "Force"
            widget: "object"
            hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "WeaknessEffect"
            label: "Faiblesse"
            widget: "object"
            hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
      - name: "rarity"
        label: "Rareté"
        widget: "select"
        required: true
        hint: "Rareté dans les coffres et prix chez le marchand. Toujours écrite (filtres et groupes de cette liste)."
        options:
          - label: "Commun"
            value: "R0_COMMON"
          - label: "Peu commun"
            value: "R1_UNCOMMON"
          - label: "Rare"
            value: "R2_RARE"
          - label: "Épique"
            value: "R3_EPIC"
          - label: "Légendaire"
            value: "R4_LEGENDARY"
      - name: "category"
        label: "Type"
        widget: "select"
        required: true
        hint: "Famille de l'arme (docs/game-design.md, « Catégories d'armes »), pour trier et filtrer cette liste. Pas encore utilisée en jeu."
        options:
          - label: "Autre"
            value: "OTHER"
          - label: "Épée"
            value: "SWORD"
          - label: "Rapière"
            value: "RAPIER"
          - label: "Fléau"
            value: "FLAIL"
          - label: "Shuriken"
            value: "SHURIKEN"
          - label: "Arc"
            value: "BOW"
          - label: "Arbalète"
            value: "CROSSBOW"
          - label: "Dague de parade"
            value: "PARRYING_DAGGER"
          - label: "Javelot"
            value: "JAVELIN"
          - label: "Griffe"
            value: "CLAW"
          - label: "Hache"
            value: "AXE"
          - label: "Marteau"
            value: "HAMMER"
          - label: "Estoc"
            value: "ESTOC"
          - label: "Katana"
            value: "KATANA"
          - label: "Bouclier"
            value: "SHIELD"
      - name: "attack"
        label: "Attaque"
        widget: "object"
        required: false
        collapsed: false
        hint: "Ce que fait le personnage à chaque tour de combat. Vide = attaque du personnage sans arme."
        fields:
          - name: "display_name"
            label: "Nom de l'attaque"
            widget: "string"
            required: false
            hint: "Vide = \"Attack\"."
          - name: "effects"
            label: "Effets de l'attaque"
            label_singular: "Effet"
            widget: "list"
            required: false
            hint: "Appliqués dans l'ordre à chaque coup."
            typeKey: "type"
            types:
              - name: "DamageEffect"
                label: "Dégâts"
                widget: "object"
                hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
              - name: "HealEffect"
                label: "Soin"
                widget: "object"
                hint: "Rend des PV au porteur, sans dépasser son maximum."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
              - name: "StrengthEffect"
                label: "Force"
                widget: "object"
                hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
              - name: "WeaknessEffect"
                label: "Faiblesse"
                widget: "object"
                hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
      - name: "attack_range"
        label: "Portée"
        widget: "number"
        value_type: "int"
        min: 1
        max: 10
        step: 1
        required: false
        hint: "En cases : 1 = les 8 cases autour, au-delà sans diagonales. Vide = 1."
      - name: "traits"
        label: "Traits"
        label_singular: "Trait"
        widget: "list"
        required: false
        hint: "Propriétés spéciales de l'arme : n'ajouter que celles qu'elle a, une seule de chaque sorte (la première compte)."
        typeKey: "type"
        types:
          - name: "MultiStrikeTrait"
            label: "Frappes multiples"
            widget: "object"
            hint: "Plusieurs attaques par tour : les suivantes visent la même cible, ou le monstre à portée le plus proche une fois la cible morte."
            fields:
              - name: "strikes"
                label: "Frappes par tour"
                widget: "number"
                value_type: "int"
                min: 2
                max: 5
                step: 1
                required: false
                hint: "Vide = 2."
          - name: "RecoveryTrait"
            label: "Récupération"
            widget: "object"
            hint: "Le personnage passe des tours après chaque tour où il a attaqué."
            fields:
              - name: "turns"
                label: "Tours passés"
                widget: "number"
                value_type: "int"
                min: 1
                max: 5
                step: 1
                required: false
                hint: "Vide = 1."
          - name: "RicochetTrait"
            label: "Ricochets"
            widget: "object"
            hint: "Après chaque coup, le coup rebondit vers le monstre le plus proche pas encore touché, avec les dégâts de l'attaque."
            fields:
              - name: "count"
                label: "Rebonds"
                widget: "number"
                value_type: "int"
                min: 1
                max: 5
                step: 1
                required: false
                hint: "Vide = 1."
          - name: "MultiTargetTrait"
            label: "Cibles multiples"
            widget: "object"
            hint: "Chaque frappe touche la cible, puis les autres monstres à portée les plus proches, chacun prenant toute l'attaque."
            fields:
              - name: "targets"
                label: "Cibles par frappe"
                widget: "number"
                value_type: "int"
                min: 2
                max: 5
                step: 1
                required: false
                hint: "Vide = 2."
          - name: "SplashTrait"
            label: "Éclaboussure"
            widget: "object"
            hint: "Après chaque coup, les autres monstres autour de la cible (diagonales comprises) subissent aussi les dégâts de l'attaque."
            fields:
              - name: "radius"
                label: "Rayon"
                widget: "number"
                value_type: "int"
                min: 1
                max: 3
                step: 1
                required: false
                hint: "1 = les 8 cases autour de la cible. Vide = 1."
          - name: "ShieldPierceTrait"
            label: "Perce-bouclier"
            widget: "object"
            hint: "Chaque coup (ricochets et éclaboussure compris) passe outre les points de bouclier de la cible."
            fields: []
          - name: "ShieldBreakTrait"
            label: "Brise-bouclier"
            widget: "object"
            hint: "À chaque coup, une chance de retirer tout le bouclier de la cible avant les dégâts."
            fields:
              - name: "chance"
                label: "Chance (%)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 100
                step: 1
                required: false
                hint: "Vide = 1."
          - name: "OpeningHitTrait"
            label: "Premier coup"
            widget: "object"
            hint: "Dégâts ajoutés au premier coup sur chaque monstre d'un combat (pas aux ricochets ni à l'éclaboussure)."
            fields:
              - name: "damage"
                label: "Dégâts en plus"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Vide = 1."
          - name: "ResistancePierceTrait"
            label: "Ignore la résistance"
            widget: "object"
            hint: "Frappe à pleine puissance quelle que soit la résistance de la cible."
            fields: []
          - name: "ParryTrait"
            label: "Parade"
            widget: "object"
            hint: "Chance de parer chaque attaque d'un monstre (cumulée avec les artéfacts, plafonnée)."
            fields:
              - name: "chance"
                label: "Chance (%)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 100
                step: 1
                required: false
                hint: "Vide = 1."
          - name: "ShieldGainTrait"
            label: "Bouclier par frappe"
            widget: "object"
            hint: "Points de bouclier gagnés à chaque frappe, perdus en fin de combat."
            fields:
              - name: "amount"
                label: "Points"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Vide = 1."
          - name: "ThornsTrait"
            label: "Épines"
            widget: "object"
            hint: "Dégâts renvoyés au monstre à chaque attaque reçue (ajoutés à ceux de l'armure)."
            fields:
              - name: "damage"
                label: "Dégâts"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Vide = 1."
