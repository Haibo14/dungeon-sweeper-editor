      - name: "attack"
        label: "Attaque"
        widget: "object"
        required: false
        collapsed: false
        hint: "Ce que fait le personnage à chaque tour de combat. Vide = attaque du personnage sans arme."
        fields:
          - name: "display_name"
            label: "Nom de l'attaque"
            widget: "string"
            required: false
            hint: "Vide = \"Attack\"."
          - name: "effects"
            label: "Effets de l'attaque"
            label_singular: "Effet"
            widget: "list"
            required: false
            hint: "Appliqués dans l'ordre à chaque coup."
            typeKey: "type"
            types:
              - name: "DamageEffect"
                label: "Dégâts"
                widget: "object"
                hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
              - name: "HealEffect"
                label: "Soin"
                widget: "object"
                hint: "Rend des PV au porteur, sans dépasser son maximum."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
              - name: "StrengthEffect"
                label: "Force"
                widget: "object"
                hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
              - name: "WeaknessEffect"
                label: "Faiblesse"
                widget: "object"
                hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
                fields:
                  - name: "amount"
                    label: "Montant"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 99
                    step: 1
                    required: false
                    hint: "Nombre de PV, de charges… Vide = 1."
      - name: "attack_range"
        label: "Portée"
        widget: "number"
        value_type: "int"
        min: 1
        max: 10
        step: 1
        required: false
        hint: "En cases : 1 = les 8 cases autour, au-delà sans diagonales. Vide = 1."
      - name: "strikes"
        label: "Frappes par tour"
        widget: "number"
        value_type: "int"
        min: 1
        max: 5
        step: 1
        required: false
        hint: "Les suivantes visent la même cible, ou le monstre à portée le plus proche une fois la cible morte. Vide = 1."
      - name: "recovery_turns"
        label: "Tours de récupération"
        widget: "number"
        value_type: "int"
        min: 0
        max: 5
        step: 1
        required: false
        hint: "Tours passés après chaque tour d'attaque. Vide = 0."
      - name: "ricochets"
        label: "Ricochets"
        widget: "number"
        value_type: "int"
        min: 0
        max: 5
        step: 1
        required: false
        hint: "Rebonds de chaque coup vers le monstre le plus proche pas encore touché. Vide = 0."
      - name: "targets"
        label: "Cibles par frappe"
        widget: "number"
        value_type: "int"
        min: 1
        max: 5
        step: 1
        required: false
        hint: "La cible, puis les autres monstres à portée les plus proches. Vide = 1."
      - name: "splash_radius"
        label: "Rayon d'éclaboussure"
        widget: "number"
        value_type: "int"
        min: 0
        max: 3
        step: 1
        required: false
        hint: "Distance autour de la cible, diagonales comprises, où les monstres subissent aussi l'attaque. 0 = aucune. Vide = 0."
      - name: "ignores_shield"
        label: "Ignore le bouclier"
        widget: "boolean"
        required: false
        hint: "Chaque coup passe outre les points de bouclier. Vide = non."
      - name: "break_shield_chance"
        label: "Brise-bouclier (%)"
        widget: "number"
        value_type: "int"
        min: 0
        max: 100
        step: 1
        required: false
        hint: "Chance par coup de retirer tout le bouclier de la cible avant les dégâts. Vide = 0."
      - name: "opening_hit_damage"
        label: "Dégâts du premier coup"
        widget: "number"
        value_type: "int"
        min: 0
        max: 99
        step: 1
        required: false
        hint: "Ajoutés au premier coup sur chaque monstre d'un combat. Vide = 0."
      - name: "ignores_resistance"
        label: "Ignore la résistance"
        widget: "boolean"
        required: false
        hint: "Frappe à pleine puissance quelle que soit la résistance de la cible. Vide = non."
      - name: "parry_chance"
        label: "Parade (%)"
        widget: "number"
        value_type: "int"
        min: 0
        max: 100
        step: 1
        required: false
        hint: "Chance de parer chaque attaque d'un monstre (cumulée avec les artéfacts, plafonnée). Vide = 0."
      - name: "shield_gain"
        label: "Bouclier par frappe"
        widget: "number"
        value_type: "int"
        min: 0
        max: 99
        step: 1
        required: false
        hint: "Points de bouclier gagnés à chaque frappe, perdus en fin de combat. Vide = 0."
      - name: "thorns"
        label: "Épines"
        widget: "number"
        value_type: "int"
        min: 0
        max: 99
        step: 1
        required: false
        hint: "Dégâts renvoyés au monstre à chaque attaque reçue (ajoutés à ceux de l'armure). Vide = 0."
