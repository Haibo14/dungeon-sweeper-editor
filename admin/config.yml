              - name: "weight"
                label: "Poids"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.1
                required: false
                default: 1.0
                hint: "Chances relatives parmi les pièges du biome : 3 sort trois fois plus souvent que 1, 0 = jamais. Vide = 1."
              - name: "min_tier"
                label: "Palier min"
                widget: "number"
                value_type: "int"
                min: 0
                max: 20
                step: 1
                required: false
                default: 0
                hint: "Ce piège ne sort qu'à partir de ce palier d'étage (« Palier » de l'étage). 0 ou vide = dès le palier 1."
              - name: "max_tier"
                label: "Palier max"
                widget: "number"
                value_type: "int"
                min: 0
                max: 20
                step: 1
                required: false
                default: 0
                hint: "Ce piège ne sort plus au-delà de ce palier d'étage. 0 ou vide = sans limite."
          - name: "MonsterSpawn"
            label: "Monstre"
            widget: "object"
            summary: "Monstre : {{fields.monster}} ({{fields.weight}}, paliers {{fields.min_tier}}-{{fields.max_tier}})"
            fields:
              - name: "monster"
                label: "Monstre"
                widget: "relation"
                collection: "monsters"
                value_field: "monsters/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Monstres » : un nouveau monstre y apparaît de lui-même."
              - name: "weight"
                label: "Poids"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.1
                required: false
                default: 1.0
                hint: "Chances relatives parmi les monstres du biome : 3 sort trois fois plus souvent que 1, 0 = jamais. Vide = 1."
              - name: "min_tier"
                label: "Palier min"
                widget: "number"
                value_type: "int"
                min: 0
                max: 20
                step: 1
                required: false
                default: 0
                hint: "Ce monstre ne sort qu'à partir de ce palier d'étage (« Palier » de l'étage). 0 ou vide = dès le palier 1."
              - name: "max_tier"
                label: "Palier max"
                widget: "number"
                value_type: "int"
                min: 0
                max: 20
                step: 1
                required: false
                default: 0
                hint: "Ce monstre ne sort plus au-delà de ce palier d'étage. 0 ou vide = sans limite."
              - name: "rules"
                label: "Règles"
                label_singular: "Règle"
                widget: "list"
                required: false
                hint: "Limites de ce monstre dans les salles de ce biome, n'ajouter que celles qui servent. Au moins un monstre du biome doit rester sans règle à chaque palier."
                typeKey: "type"
                types:
                  - name: "MaxPerRoomRule"
                    label: "Maximum par salle"
                    widget: "object"
                    hint: "Au plus ce nombre de ce monstre dans une salle ; les autres cases tirent parmi les autres monstres."
                    fields:
                      - name: "limit"
                        label: "Maximum"
                        widget: "number"
                        value_type: "int"
                        min: 1
                        step: 1
                        required: false
                        default: 1
                        hint: "Vide = 1."
                  - name: "MaxPerGroupRule"
                    label: "Maximum par groupe"
                    widget: "object"
                    hint: "Au plus ce nombre de ce monstre dans un combat : un groupe de dangers voisins, ou les groupes autour d'une même case sûre (comme « Monstres max par combat »)."
                    fields:
                      - name: "limit"
                        label: "Maximum"
                        widget: "number"
                        value_type: "int"
                        min: 1
                        step: 1
                        required: false
                        default: 1
                        hint: "Vide = 1."
  - name: "traps"
    label: "Pièges"
    label_singular: "Piège"
    description: "Pièges du jeu : un fichier JSON par piège (format : docs/data.md du dépôt du jeu). Un nouveau piège n'apparaît que dans les biomes qui le listent. Ses effets peuvent être réglés par palier d'étage (« Paliers »)."
    folder: "data/traps"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    fields:
      - name: "design_notes"
        label: "À implémenter"
        widget: "text"
        required: false
        hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
        required: false
        default: false
        hint: "Coché : chargé et vérifié, mais absent du jeu (butin, dangers, artéfacts) jusqu'à son implémentation. Seul un autre brouillon peut y faire référence (un étage ne peut pas lister un monstre brouillon)."
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'un nouveau piège (« Piège à fosse » → piege_a_fosse.json)."
      - name: "spawn_weight"
        label: "Poids hors liste d'étage"
        widget: "number"
        value_type: "float"
        min: 0
        step: 0.1
        required: false
        default: 1.0
        hint: "Seulement pour un étage sans sa propre liste de dangers (aucun aujourd'hui) : chances relatives parmi les pièges, 0 = jamais. Vide = 1."
      - name: "effects"
        label: "Effets du piège"
        label_singular: "Effet"
        widget: "list"
        required: false
        hint: "Appliqués dans l'ordre au personnage quand il révèle le piège sans drapeau dessus, à tous les paliers quand « Paliers » est vide."
        typeKey: "type"
        types:
          - name: "DamageEffect"
            label: "Dégâts"
            widget: "object"
            hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "HealEffect"
            label: "Soin"
            widget: "object"
            hint: "Rend des PV au porteur, sans dépasser son maximum."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "StrengthEffect"
            label: "Force"
            widget: "object"
            hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "WeaknessEffect"
            label: "Faiblesse"
            widget: "object"
            hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "ShieldBreakEffect"
            label: "Brise-bouclier"
            widget: "object"
            hint: "Retire tout le bouclier de la cible (durable compris), sans dégâts ; sans bouclier, lui retire des PV (plus les bonus de dégâts)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Dégâts sans bouclier. Vide = 1."
          - name: "StatusEffect"
            label: "Statut"
            widget: "object"
            hint: "Donne des charges d'un statut à la cible (ou au porteur si « Au porteur » est coché), pour le combat ou pour l'étage. Chaque charge vaut 1 ; dégâts, déplacement et portée ne descendent jamais sous 1, et la résistance ne fait jamais descendre un coup reçu sous 1 dégât."
            fields:
              - name: "status"
                label: "Statut"
                widget: "select"
                required: true
                hint: "Bonus : force, résistance, vitesse, portée +. Malus : dégâts en moins, faiblesse, lenteur, portée −."
                options:
                  - label: "Force (+1 dégât par attaque)"
                    value: "STRENGTH"
                  - label: "Dégâts en moins (−1 dégât par attaque)"
                    value: "FEEBLE"
                  - label: "Faiblesse (+1 dégât subi par coup)"
                    value: "WEAKNESS"
                  - label: "Résistance (−1 dégât subi par coup, jamais sous 1)"
                    value: "RESISTANCE"
                  - label: "Vitesse (+1 case de déplacement)"
                    value: "HASTE"
                  - label: "Lenteur (−1 case de déplacement)"
                    value: "SLOW"
                  - label: "Portée + (+1 de portée)"
                    value: "RANGE_UP"
                  - label: "Portée − (−1 de portée)"
                    value: "RANGE_DOWN"
              - name: "amount"
                label: "Charges"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de charges données. Vide = 1."
              - name: "duration"
                label: "Durée"
                widget: "select"
                required: false
                default: "FIGHT"
                hint: "Vide = jusqu'à la fin du combat (ou du suivant, si reçu hors combat)."
                options:
                  - label: "Jusqu'à la fin du combat"
                    value: "FIGHT"
                  - label: "Jusqu'à la fin de l'étage"
                    value: "FLOOR"
              - name: "on_source"
                label: "Au porteur"
                widget: "boolean"
                required: false
                default: false
                hint: "Coché : au porteur de l'arme (ou au monstre qui attaque) au lieu de la cible. Sans effet pour un piège."
          - name: "BossStatusEffect"
            label: "Statut du boss"
            widget: "object"
            hint: "Pour le piège d'une salle de boss : donne des charges d'un statut au boss de la salle (pas au personnage), jusqu'à la fin de son combat, sans dépasser le maximum. Sans effet hors d'une salle de boss ou une fois le boss vaincu."
            fields:
              - name: "status"
                label: "Statut"
                widget: "select"
                required: false
                default: "SPLIT"
                hint: "Division : le boss se divise une fois vaincu (s'il a le comportement « Division »). Horde : il invoque un monstre de plus par tour (s'il a le comportement « Invocation »). Revive : vaincu, il revient avec tous ses PV et une charge de moins. Vide = Division."
                options:
                  - label: "Division (se divise une fois vaincu)"
                    value: "SPLIT"
                  - label: "Horde (+1 monstre invoqué par tour)"
                    value: "HORDE"
                  - label: "Revive (revient avec tous ses PV une fois vaincu)"
                    value: "REVIVE"
                  - label: "Force (+1 dégât par attaque)"
                    value: "STRENGTH"
                  - label: "Résistance (−1 dégât subi par coup, jamais sous 1)"
                    value: "RESISTANCE"
                  - label: "Vitesse (+1 case de déplacement)"
                    value: "HASTE"
                  - label: "Portée + (+1 de portée)"
                    value: "RANGE_UP"
              - name: "amount"
                label: "Charges"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Charges données à chaque déclenchement. Vide = 1."
              - name: "max_stacks"
                label: "Maximum"
