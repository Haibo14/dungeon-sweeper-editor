        widget: "string"
        required: true
        hint: "Nom du boss. Donne aussi le nom du fichier d'un nouveau boss (« Roi liche » → roi_liche.json)."
      - name: "monster"
        label: "Monstre"
        widget: "relation"
        collection: "monsters"
        value_field: "monsters/{{slug}}"
        display_fields:
          - "display_name"
        dropdown_threshold: 0
        required: true
        hint: "Profil de la collection « Monstres » avec lequel le boss se bat, au palier de l'étage ; son « Apparence » est celle du boss (vignette de la liste des boss). Lui donner un profil à part (poids 0, dans aucun biome) pour régler ses stats et son apparence sans toucher aux monstres ordinaires."
      - name: "level_number"
        label: "Étage"
        widget: "number"
        value_type: "int"
        min: 1
        max: 100
        step: 1
        required: true
        default: 1
        hint: "Étage de la salle du boss, 1 pour le premier. Au plus un boss par étage, et pas au-delà du nombre d'étages du donjon (vérifié par la CI)."
      - name: "size"
        label: "Taille du boss"
        widget: "number"
        value_type: "int"
        min: 1
        max: 2
        step: 1
        required: false
        default: 1
        hint: "Côté du carré de cases du boss : 1 (1 × 1) ou 2 (2 × 2 : marquer les 4 cases pour l'attaquer en premier ; une case révélée sans drapeau lui donne la surprise). Vide = 1."
      - name: "room_size"
        label: "Taille de la salle"
        widget: "number"
        value_type: "int"
        min: 5
        max: 30
        step: 1
        required: false
        default: 9
        hint: "Largeur et hauteur de la salle du boss, carrée, en cases. Le boss se tient dans la moitié opposée à la porte. Vide = 9."
      - name: "mine_density"
        label: "Densité de dangers"
        widget: "number"
        value_type: "float"
        min: 0
        max: 0.5
        step: 0.01
        required: false
        default: 0.15
        hint: "Part des cases de la salle qui portent un autre danger que le boss (0.15 = 15 %), le boss en plus. Rien ne le touche, et aucun monstre n'est à 2 cases de lui. Vide = 0.15."
      - name: "biome"
        label: "Biome"
        widget: "relation"
        collection: "biomes"
        value_field: "biomes/{{slug}}"
        display_fields:
          - "display_name"
        dropdown_threshold: 0
        required: false
        hint: "Pièges et monstres de la salle du boss, au palier de l'étage (collection « Biomes »). Vide = un biome de l'étage, tiré comme pour ses autres salles."
      - name: "room_trap"
        label: "Piège de la salle"
        widget: "relation"
        collection: "traps"
        value_field: "traps/{{slug}}"
        display_fields:
          - "display_name"
        dropdown_threshold: 0
        required: false
        hint: "Tous les pièges de la salle du boss deviennent celui-ci (au palier de l'étage), les monstres restent ceux du biome (collection « Pièges » ; mettre son poids à 0 pour qu'il ne sorte jamais ailleurs). Vide = les pièges du biome."
      - name: "room_traps"
        label: "Pièges de la salle (avec poids)"
        label_singular: "Piège de la salle"
        widget: "list"
        required: false
        hint: "Tous les pièges de la salle du boss deviennent l'un de ceux-ci (au palier de l'étage), tirés selon leurs poids entre eux : chaque piège du biome est partagé entre eux, la salle garde autant de pièges. Les monstres restent ceux du biome. Remplace « Piège de la salle » quand la liste n'est pas vide (Great Demon : Abyssal Rift et Infernal Pact). Vide = « Piège de la salle », sinon les pièges du biome."
        typeKey: "type"
        types:
          - name: "TrapSpawn"
            label: "Piège"
            widget: "object"
            summary: "{{fields.trap}} (poids {{fields.weight}})"
            fields:
              - name: "trap"
                label: "Piège"
                widget: "relation"
                collection: "traps"
                value_field: "traps/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Pièges » ; mettre son poids d'apparition à 0 pour qu'il ne sorte jamais ailleurs."
              - name: "weight"
                label: "Poids"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.1
                required: false
                default: 1.0
                hint: "Chances relatives parmi les pièges de la salle : 3 sort trois fois plus souvent que 1, 0 = jamais. Vide = 1."
      - name: "hidden_number_rate"
        label: "Cases « ? » (part des chiffres cachés)"
        widget: "number"
        value_type: "float"
        min: 0
        max: 1
        step: 0.01
        required: false
        default: 0
        hint: "Part des cases à chiffre de la salle du boss qui montrent un « ? » neutre au lieu de leur chiffre (0.3 = environ un chiffre sur trois). Tirées avec les dangers, jamais deux « ? » côte à côte (diagonales comprises) : moins de « ? » si elles ne tiennent pas. Une case vide (sans chiffre) n'en devient jamais une ; pas d'accord sur un « ? ». Vide ou 0 = tous les chiffres visibles."
      - name: "ciphered_numbers"
        label: "Chiffres en runes"
        widget: "boolean"
        required: false
        default: false
        hint: "Coché : chaque chiffre de la salle du boss est remplacé par une rune de couleur (rune et couleur tirées à part, une fois par partie), à déchiffrer par le joueur. Pas d'accord (clic sur une rune entourée de ses drapeaux) : il dirait ce que vaut la rune. Vide = chiffres normaux."
      - name: "excluded_monsters"
        label: "Monstres exclus de la salle"
        widget: "relation"
        collection: "monsters"
        value_field: "monsters/{{slug}}"
        display_fields:
          - "display_name"
        dropdown_threshold: 0
        multiple: true
        required: false
        hint: "Monstres du biome qui ne sortent jamais dans la salle du boss (le Necromancer ordinaire chez le Necromancer Lord). La CI vérifie qu'il reste un monstre sans règle d'apparition. Vide = tous les monstres du biome."
