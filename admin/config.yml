      - name: "effects"
        label: "Effets de l'objet"
        label_singular: "Effet"
        widget: "list"
        required: false
        hint: "Pas encore appliqués en jeu : laisser vide."
        typeKey: "type"
        types:
          - name: "DamageEffect"
            label: "Dégâts"
            widget: "object"
            hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "HealEffect"
            label: "Soin"
            widget: "object"
            hint: "Rend des PV au porteur, sans dépasser son maximum."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "StrengthEffect"
            label: "Force"
            widget: "object"
            hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "WeaknessEffect"
            label: "Faiblesse"
            widget: "object"
            hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                hint: "Nombre de PV, de charges… Vide = 1."
      - name: "rarity"
        label: "Rareté"
        widget: "select"
        required: true
        hint: "Rareté dans les coffres et prix chez le marchand. Toujours écrite (filtres et groupes de cette liste)."
        options:
          - label: "Commun"
            value: "COMMON"
          - label: "Peu commun"
            value: "UNCOMMON"
          - label: "Rare"
            value: "RARE"
          - label: "Épique"
            value: "EPIC"
          - label: "Légendaire"
            value: "LEGENDARY"
      - name: "category"
        label: "Type"
        widget: "select"
        required: true
        hint: "Famille de l'arme (docs/game-design.md, « Catégories d'armes »), pour trier et filtrer cette liste. Pas encore utilisée en jeu."
