          field: "rarity"
          eq: "R3_EPIC"
        - name: "rarity_r4_legendary"
          label: "Rareté : Légendaire"
          field: "rarity"
          eq: "R4_LEGENDARY"
    view_groups:
      groups:
        - name: "rarity"
