  - name: "levels"
    label: "Étages"
    label_singular: "Étage"
    description: "Étages du donjon : un fichier JSON par étage (format : docs/data.md du dépôt du jeu). Chaque étage tire un ou plusieurs biomes dans sa liste, puis chaque salle prend l'un d'eux. L'ordre et le nombre des étages se règlent dans la collection « Donjon » (data/dungeon/dungeon.json) : ni création ni suppression ici."
    folder: "data/levels"
    extension: "json"
    format: "json"
    create: false
    delete: false
    summary: "{{filename}}"
