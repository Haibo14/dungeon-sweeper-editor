  - name: "player"
    label: "Joueur"
    description: "Réglages du personnage (format : docs/data.md du dépôt du jeu) : un seul fichier, data/player/player.json."
    format: "json"
    files:
      - name: "player"
        label: "Réglages du joueur"
        file: "data/player/player.json"
        fields:
          - name: "design_notes"
            label: "À implémenter"
            widget: "text"
            required: false
            hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
          - name: "max_health"
            label: "PV max"
            widget: "number"
            value_type: "int"
            min: 1
            max: 99
            step: 1
            required: true
            hint: "1 point = un demi-cœur. Toujours écrit (défaut du script : 3)."
