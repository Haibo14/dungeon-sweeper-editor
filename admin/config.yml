            widget: "number"
            value_type: "int"
            min: 0
            max: 10
            step: 1
            required: false
            default: 1
            hint: "Équipements ou potions par coffre, tirés entre le min et le max. Vide = 1."
          - name: "max_items"
            label: "Récompenses : nombre max"
            widget: "number"
            value_type: "int"
            min: 0
            max: 10
            step: 1
            required: false
            default: 2
            hint: "Vide = 2."
          - name: "equipment_weight"
            label: "Poids : équipement"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 60.0
            hint: "Chances relatives de chaque sorte de récompense. Vide = 60."
          - name: "potion_weight"
            label: "Poids : potion"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 25.0
            hint: "Vide = 25."
          - name: "common_weight"
            label: "Poids : commun"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 60.0
            hint: "Chances relatives de chaque rareté (3 sort trois fois plus souvent que 1, 0 = jamais). Vide = 60."
          - name: "uncommon_weight"
            label: "Poids : peu commun"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 25.0
            hint: "Vide = 25."
          - name: "rare_weight"
            label: "Poids : rare"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 10.0
            hint: "Vide = 10."
          - name: "epic_weight"
            label: "Poids : épique"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 4.0
            hint: "Vide = 4."
          - name: "legendary_weight"
            label: "Poids : légendaire"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 1.0
            hint: "Vide = 1."
          - name: "potions"
            label: "Potions"
            label_singular: "Potion"
            widget: "list"
            required: false
            hint: "Potions possibles, chacune avec son poids. Vide = aucune potion."
            summary: "{{fields.potion}} ({{fields.weight}})"
            fields:
              - name: "potion"
                label: "Potion"
                widget: "relation"
                collection: "potions"
                value_field: "potions/{{slug}}"
