        label: "Rareté"
        widget: "select"
        required: true
        hint: "Une offre de fin d'étage tire d'abord une rareté (poids de rareté des « Récompenses de salle » de l'étage) ; un coffre de salle des coffres, avec ses propres poids. Toujours écrite (filtres et groupes de cette liste)."
        options:
          - label: "Commun"
            value: "R0_COMMON"
          - label: "Peu commun"
            value: "R1_UNCOMMON"
          - label: "Rare"
            value: "R2_RARE"
          - label: "Épique"
            value: "R3_EPIC"
          - label: "Légendaire"
            value: "R4_LEGENDARY"
      - name: "effects"
        label: "Effets"
        label_singular: "Effet"
        widget: "list"
        required: false
        hint: "Ce que fait l'artéfact, en général un seul effet. Des effets de même sorte s'additionnent. Immédiat : donné une fois en le prenant ; passif et donjon : tant qu'on le garde."
        typeKey: "type"
        types:
          - name: "GoldArtifactEffect"
            label: "Immédiat : or"
            widget: "object"
            hint: "Or reçu en le prenant."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9999
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "MaxHealthArtifactEffect"
            label: "Immédiat : PV max"
            widget: "object"
            hint: "PV max gagnés pour toujours (1 = un demi-cœur), soignés aussi en le prenant."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "LastingShieldArtifactEffect"
            label: "Immédiat : bouclier durable"
            widget: "object"
            hint: "Points de bouclier durable reçus en le prenant."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "MaxHealthLossArtifactEffect"
            label: "Immédiat : PV max perdus"
            widget: "object"
            hint: "Artéfact maudit : PV max perdus en le prenant, jamais sous 1 ni mortel."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "BonusDamageArtifactEffect"
            label: "Passif : dégâts bonus"
            widget: "object"
            hint: "Dégâts en plus à chaque coup de l'attaque du personnage (ricochets compris)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "StartingWeaknessArtifactEffect"
            label: "Passif : faiblesse au départ"
            widget: "object"
            hint: "Charges de faiblesse du personnage au début de chaque combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "EchoArtifactEffect"
            label: "Passif : écho"
            widget: "object"
            hint: "Chaque coup du personnage inflige aussi ces dégâts à chacun des autres monstres du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "ArmorArtifactEffect"
            label: "Passif : armure"
            widget: "object"
            hint: "Points de bouclier en combat, ajoutés à ceux de l'équipement."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "DamageReductionArtifactEffect"
            label: "Passif : réduction de dégâts"
            widget: "object"
            hint: "Retirée de chaque coup reçu, jamais sous 1."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "ThornsArtifactEffect"
            label: "Passif : épines"
            widget: "object"
            hint: "Dégâts renvoyés au monstre dont l'attaque touche."
            fields:
