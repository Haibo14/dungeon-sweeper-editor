  - name: "levels"
    label: "Étages"
    label_singular: "Étage"
    description: "Étages du donjon : un fichier JSON par étage (format : docs/data.md du dépôt du jeu). L'ordre et le nombre des étages se règlent dans la collection « Donjon » (data/dungeon/dungeon.json) : ni création ni suppression ici."
    folder: "data/levels"
    extension: "json"
    format: "json"
    create: false
    delete: false
    summary: "{{filename}}"
    fields:
      - name: "design_notes"
        label: "À implémenter"
        widget: "text"
        required: false
        hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
        required: false
        default: false
        hint: "Coché : chargé et vérifié, mais absent du jeu (butin, dangers, artéfacts) jusqu'à son implémentation. Seul un autre brouillon peut y faire référence (un étage ne peut pas lister un monstre brouillon)."
      - name: "min_room_count"
        label: "Salles : nombre min"
        widget: "number"
        value_type: "int"
        min: 1
        max: 50
        step: 1
        required: false
        default: 6
        hint: "Le nombre de salles est tiré entre le min et le max. Vide = 6."
      - name: "max_room_count"
        label: "Salles : nombre max"
        widget: "number"
        value_type: "int"
        min: 1
        max: 50
        step: 1
        required: false
        default: 8
        hint: "Vide = 8."
      - name: "min_room_size"
        label: "Salles : taille min"
        widget: "number"
        value_type: "int"
        min: 3
        max: 30
        step: 1
        required: false
        default: 6
        hint: "Largeur et hauteur de chaque salle, tirées séparément entre le min et le max. Vide = 6."
      - name: "max_room_size"
        label: "Salles : taille max"
        widget: "number"
        value_type: "int"
        min: 3
        max: 30
        step: 1
        required: false
        default: 12
        hint: "Vide = 12."
      - name: "mine_density"
        label: "Densité de dangers"
        widget: "number"
        value_type: "float"
        min: 0
        max: 0.5
        step: 0.01
        required: false
        default: 0.15
        hint: "Part des cases d'une salle qui portent un danger (0.15 = 15 %). Vide = 0.15."
      - name: "hazards"
        label: "Dangers"
        label_singular: "Danger"
        widget: "list"
        required: false
        hint: "Pièges et monstres de l'étage, chacun avec son poids parmi ceux de sa sorte (chaque case tire d'abord piège ou monstre selon la chance de monstre du donjon). « Ajouter » demande d'abord la sorte. Vide = liste par défaut du donjon."
        typeKey: "type"
        types:
          - name: "TrapSpawn"
            label: "Piège"
            widget: "object"
            summary: "Piège : {{fields.trap}} ({{fields.weight}})"
            fields:
              - name: "trap"
                label: "Piège"
                widget: "relation"
                collection: "traps"
                value_field: "traps/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Pièges » : un nouveau piège y apparaît de lui-même."
              - name: "weight"
                label: "Poids"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.1
                required: false
                default: 1.0
                hint: "Chances relatives parmi les pièges de l'étage : 3 sort trois fois plus souvent que 1, 0 = jamais. Vide = 1."
          - name: "MonsterSpawn"
            label: "Monstre"
            widget: "object"
            summary: "Monstre : {{fields.monster}} ({{fields.weight}})"
