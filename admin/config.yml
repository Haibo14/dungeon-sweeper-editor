      - name: "effects"
        label: "Effets"
        label_singular: "Effet"
        widget: "list"
        required: false
        hint: "Ce que fait l'artéfact, en général un seul effet. Des effets de même sorte s'additionnent. Immédiat : donné une fois en le prenant ; passif et donjon : tant qu'on le garde."
