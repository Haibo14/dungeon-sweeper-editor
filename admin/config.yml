              - name: "amount"
                label: "Force par coup"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Charges de force gagnées à chaque coup reçu. Vide = 1."
          - name: "SummonBehavior"
            label: "Invocation"
            widget: "object"
            hint: "Au lieu de marcher et d'attaquer, il invoque des monstres à côté de lui à chacun de ses tours (plus un par charge du statut « Horde »). Ils rejoignent l'ordre des tours en dernier et ne jouent qu'après le prochain tour du personnage ; l'invocateur se place après eux. Après ses invocations, il s'enfuit à son tour suivant. Un monstre sans attaque doit avoir ce comportement."
            fields:
              - name: "monster"
                label: "Monstre invoqué"
                widget: "relation"
                collection: "monsters"
                value_field: "monsters/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Monstres » (un nouveau monstre y apparaît de lui-même). Un monstre invoqué n'invoque jamais à son tour."
              - name: "count"
                label: "Invocations"
                widget: "number"
                value_type: "int"
                min: 0
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Monstres invoqués en tout avant de s'enfuir. 0 = il ne s'enfuit jamais et invoque tout le combat (Necromancer Lord). Vide = 1."
              - name: "per_turn"
                label: "Invocations par tour"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Monstres invoqués à chaque tour, avant le statut « Horde » (+1 par charge). Vide = 1."
              - name: "max_per_turn"
                label: "Maximum par tour"
                widget: "number"
                value_type: "int"
                min: 0
                max: 9
                step: 1
                required: false
                default: 0
                hint: "Monstres invoqués au plus en un tour, « Horde » comprise (3 pour le Necromancer Lord). Vide ou 0 = sans limite."
          - name: "PriorityTargetBehavior"
            label: "Cible prioritaire"
            widget: "object"
            hint: "Le personnage le vise tant qu'un chemin mène à une case d'où le frapper, même si d'autres monstres sont à portée."
            fields: []
          - name: "SplitBehavior"
            label: "Division"
            widget: "object"
            hint: "Vaincu en combat avec des charges du statut « Division » (données par un piège de boss, effet « Statut du boss »), il se divise en monstres plus petits sur ses cases puis autour, qui rejoignent le combat en dernier, avec une charge de moins chacun. Sans charge, il meurt normalement."
            fields:
              - name: "monster"
                label: "Se divise en"
                widget: "relation"
                collection: "monsters"
                value_field: "monsters/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Monstres » : en général un monstre plus faible, qui a lui-même ce comportement pour se diviser à nouveau."
              - name: "count"
                label: "Parties"
                widget: "number"
                value_type: "int"
                min: 1
                max: 4
                step: 1
                required: false
                default: 2
                hint: "Monstres qui remplacent le vaincu. Vide = 2."
      - name: "sprite_frames"
