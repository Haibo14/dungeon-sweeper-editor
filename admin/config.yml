                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "WeaknessEffect"
            label: "Faiblesse"
            widget: "object"
