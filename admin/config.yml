# Sveltia CMS - données d'équilibrage de DungeonSweeper (armes uniquement).
# Champs tirés des JSON Schema du dépôt du jeu (schema/). Ne contient aucune donnée de jeu.
backend:
  name: "github"
  repo: "<COMPTE>/dungeon-sweeper"
  branch: "balance"
media_folder: "assets/import"
public_folder: "res://assets/import"
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "_"
output:
  omit_empty_optional_fields: true
  json:
    indent_style: "space"
    indent_size: 2
collections:
  - name: "weapons"
    label: "Armes"
    label_singular: "Arme"
    description: "Armes du jeu : un fichier JSON par arme (format : docs/data.md du dépôt du jeu)."
    folder: "data/equipment/weapons"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    sortable_fields:
      fields:
        - "display_name"
        - "category"
        - "rarity"
      default:
        field: "category"
        direction: "ascending"
    view_filters:
      filters:
        - name: "category_other"
          label: "Type : Autre"
          field: "category"
          eq: "OTHER"
        - name: "category_sword"
          label: "Type : Épée"
          field: "category"
          eq: "SWORD"
        - name: "category_rapier"
          label: "Type : Rapière"
          field: "category"
          eq: "RAPIER"
        - name: "category_flail"
          label: "Type : Fléau"
          field: "category"
          eq: "FLAIL"
        - name: "category_shuriken"
          label: "Type : Shuriken"
          field: "category"
          eq: "SHURIKEN"
        - name: "category_bow"
          label: "Type : Arc"
          field: "category"
          eq: "BOW"
        - name: "category_crossbow"
          label: "Type : Arbalète"
          field: "category"
          eq: "CROSSBOW"
        - name: "category_parrying_dagger"
          label: "Type : Dague de parade"
          field: "category"
          eq: "PARRYING_DAGGER"
        - name: "category_javelin"
          label: "Type : Javelot"
          field: "category"
          eq: "JAVELIN"
        - name: "category_claw"
          label: "Type : Griffe"
          field: "category"
          eq: "CLAW"
        - name: "category_axe"
          label: "Type : Hache"
          field: "category"
          eq: "AXE"
        - name: "category_hammer"
          label: "Type : Marteau"
          field: "category"
          eq: "HAMMER"
        - name: "category_estoc"
          label: "Type : Estoc"
          field: "category"
          eq: "ESTOC"
        - name: "category_katana"
          label: "Type : Katana"
          field: "category"
          eq: "KATANA"
        - name: "category_shield"
          label: "Type : Bouclier"
          field: "category"
          eq: "SHIELD"
        - name: "rarity_common"
          label: "Rareté : Commun"
          field: "rarity"
          eq: "COMMON"
        - name: "rarity_uncommon"
          label: "Rareté : Peu commun"
          field: "rarity"
          eq: "UNCOMMON"
        - name: "rarity_rare"
          label: "Rareté : Rare"
          field: "rarity"
          eq: "RARE"
        - name: "rarity_epic"
          label: "Rareté : Épique"
          field: "rarity"
          eq: "EPIC"
        - name: "rarity_legendary"
          label: "Rareté : Légendaire"
          field: "rarity"
          eq: "LEGENDARY"
    view_groups:
      groups:
        - name: "category"
          label: "Type"
          field: "category"
        - name: "rarity"
          label: "Rareté"
          field: "rarity"
    fields:
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'une nouvelle arme (« Hache de guerre » → hache_de_guerre.json)."
      - name: "texture"
        label: "Icône"
        widget: "select"
        required: false
        hint: "Nom de l'icône dans le catalogue WeaponAtlas (<famille>_<matériau>, bâtons, épées ; aperçus dans les fiches .md de assets/atlases/weapons/)."
