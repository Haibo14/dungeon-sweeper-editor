  - name: "traps"
    label: "Pièges"
    label_singular: "Piège"
    description: "Pièges du jeu : un fichier JSON par piège (format : docs/data.md du dépôt du jeu). Un nouveau piège n'apparaît que dans les étages qui le listent : l'ajouter aux choix de « Danger » des étages dans config.yml."
    folder: "data/traps"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    fields:
      - name: "design_notes"
        label: "À implémenter"
        widget: "text"
        required: false
        hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
        required: false
        default: false
        hint: "Coché : chargé et vérifié, mais absent du jeu (butin, dangers, artéfacts) jusqu'à son implémentation. Seul un autre brouillon peut y faire référence (un étage ne peut pas lister un monstre brouillon)."
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'un nouveau piège (« Piège à fosse » → piege_a_fosse.json)."
      - name: "spawn_weight"
        label: "Poids hors liste d'étage"
        widget: "number"
        value_type: "float"
        min: 0
        step: 0.1
        required: false
        default: 1.0
        hint: "Seulement pour un étage sans sa propre liste de dangers (aucun aujourd'hui) : chances relatives parmi les pièges, 0 = jamais. Vide = 1."
      - name: "effects"
        label: "Effets du piège"
        label_singular: "Effet"
        widget: "list"
        required: false
        hint: "Appliqués dans l'ordre au personnage quand il révèle le piège sans drapeau dessus."
        typeKey: "type"
        types:
          - name: "DamageEffect"
            label: "Dégâts"
            widget: "object"
            hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "HealEffect"
            label: "Soin"
            widget: "object"
            hint: "Rend des PV au porteur, sans dépasser son maximum."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "StrengthEffect"
            label: "Force"
            widget: "object"
            hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "WeaknessEffect"
            label: "Faiblesse"
            widget: "object"
            hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de PV, de charges… Vide = 1."
          - name: "ShieldBreakEffect"
            label: "Brise-bouclier"
            widget: "object"
            hint: "Retire tout le bouclier de la cible (durable compris), sans dégâts ; sans bouclier, lui retire des PV (plus les bonus de dégâts)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Dégâts sans bouclier. Vide = 1."
          - name: "StatusEffect"
            label: "Statut"
            widget: "object"
            hint: "Donne des charges d'un statut à la cible (ou au porteur si « Au porteur » est coché), pour le combat ou pour l'étage. Chaque charge vaut 1 ; dégâts, déplacement et portée ne descendent jamais sous 1 (la résistance, elle, peut annuler un coup reçu)."
            fields:
              - name: "status"
                label: "Statut"
                widget: "select"
                required: true
                hint: "Bonus : force, résistance, vitesse, portée +. Malus : dégâts en moins, faiblesse, lenteur, portée −."
                options:
                  - label: "Force (+1 dégât par attaque)"
                    value: "STRENGTH"
                  - label: "Dégâts en moins (−1 dégât par attaque)"
                    value: "FEEBLE"
                  - label: "Faiblesse (+1 dégât subi par coup)"
                    value: "WEAKNESS"
                  - label: "Résistance (−1 dégât subi par coup, peut tomber à 0)"
                    value: "RESISTANCE"
                  - label: "Vitesse (+1 case de déplacement)"
                    value: "HASTE"
                  - label: "Lenteur (−1 case de déplacement)"
                    value: "SLOW"
                  - label: "Portée + (+1 de portée)"
                    value: "RANGE_UP"
                  - label: "Portée − (−1 de portée)"
                    value: "RANGE_DOWN"
              - name: "amount"
                label: "Charges"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Nombre de charges données. Vide = 1."
              - name: "duration"
                label: "Durée"
                widget: "select"
                required: false
                default: "FIGHT"
                hint: "Vide = jusqu'à la fin du combat (ou du suivant, si reçu hors combat)."
                options:
                  - label: "Jusqu'à la fin du combat"
                    value: "FIGHT"
                  - label: "Jusqu'à la fin de l'étage"
                    value: "FLOOR"
              - name: "on_source"
                label: "Au porteur"
                widget: "boolean"
                required: false
                default: false
                hint: "Coché : au porteur de l'arme (ou au monstre qui attaque) au lieu de la cible. Sans effet pour un piège."
      - name: "sprite_frames"
        label: "Animation"
        widget: "select"
        required: false
        hint: "Jouée une fois sur le plateau quand le piège se déclenche (animation trigger). Vide = pas d'animation, seulement sa marque."
        options:
          - label: "spike_trap_frames"
            value: "/assets/sprites/spike_trap_frames.tres"
  - name: "artifacts"
    label: "Artéfacts"
    label_singular: "Artéfact"
    description: "Artéfacts du jeu : un fichier JSON par artéfact (format : docs/data.md du dépôt du jeu). Un nouvel artéfact est proposé en fin d'étage sans rien d'autre à régler (tous les artéfacts JSON le sont)."
