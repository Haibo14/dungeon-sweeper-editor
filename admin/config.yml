            label: "Portée d'attaque"
            widget: "number"
            value_type: "int"
            min: 1
            max: 10
            step: 1
            required: true
            hint: "En cases : 1 = les 8 cases autour, au-delà comptée sans diagonales ; remplacée par celle d'une arme équipée. Toujours écrite (défaut du script : 1)."
          - name: "movement"
