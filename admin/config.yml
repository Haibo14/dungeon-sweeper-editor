                label: "Monstre"
                widget: "relation"
                collection: "monsters"
                value_field: "monsters/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Monstres » : le monstre qui apparaît, au palier de l'étage (Zombie pour le Giant Zombie)."
