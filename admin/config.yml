  - name: "biomes"
    label: "Biomes"
    label_singular: "Biome"
    description: "Biomes du donjon : un fichier JSON par biome (format : docs/data.md du dépôt du jeu), avec les pièges et monstres de ses salles. Un biome ne sort que sur les étages qui le listent (« Biomes » de l'étage)."
    folder: "data/biomes"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    fields:
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
