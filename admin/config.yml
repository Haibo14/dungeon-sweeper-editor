          field: "rarity"
    fields:
      - name: "design_notes"
        label: "À implémenter"
        widget: "text"
        required: false
        hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
        required: false
        default: false
        hint: "Coché : chargé et vérifié, mais absent du jeu (butin, dangers, artéfacts) jusqu'à son implémentation. Seul un autre brouillon peut y faire référence (un étage ne peut pas lister un monstre brouillon)."
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'un nouvel artéfact (« Anneau de feu » → anneau_de_feu.json)."
      - name: "texture"
        label: "Icône"
        widget: "image"
        required: false
        media_folder: "/assets/icons/artifacts"
        public_folder: "/assets/icons/artifacts"
        choose_url: false
        accept: "image/png"
        hint: "Une des 460 icônes de assets/icons/artifacts/ (découpées des 5 atlas d'artéfacts par build_icons.gd). Ne pas en ajouter ici : elles viennent des atlas."
      - name: "rarity"
        label: "Rareté"
        widget: "select"
        required: true
        hint: "Une offre de fin d'étage tire d'abord une rareté (poids de rareté des coffres de l'étage). Toujours écrite (filtres et groupes de cette liste)."
        options:
