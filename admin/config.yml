              - name: "monster"
                label: "Monstre"
                widget: "relation"
                collection: "monsters"
                value_field: "monsters/{{slug}}"
                display_fields:
                  - "display_name"
                dropdown_threshold: 0
                required: true
                hint: "Collection « Monstres » : un nouveau monstre y apparaît de lui-même."
              - name: "weight"
                label: "Poids"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.1
                required: false
                default: 1.0
                hint: "Chances relatives parmi les monstres de l'étage : 3 sort trois fois plus souvent que 1, 0 = jamais. Vide = 1."
              - name: "rules"
                label: "Règles"
                label_singular: "Règle"
                widget: "list"
                required: false
                hint: "Limites de ce monstre sur cet étage, n'ajouter que celles qui servent. Au moins un monstre de l'étage doit rester sans règle."
