      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom du biome. Donne aussi le nom du fichier d'un nouveau biome (« Forêt » → foret.json)."
      - name: "hazards"
        label: "Dangers"
        label_singular: "Danger"
        widget: "list"
        required: false
        hint: "Pièges et monstres des salles du biome, chacun avec son poids parmi ceux de sa sorte (chaque case tire d'abord piège ou monstre selon la chance de monstre du donjon) et ses paliers. « Ajouter » demande d'abord la sorte. Au moins un monstre sans règle à chaque palier où le biome sort."
