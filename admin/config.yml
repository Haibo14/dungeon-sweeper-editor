        min: -9
        max: 9
        step: 1
        required: false
        default: 0
        hint: "Cases ajoutées au déplacement du personnage à chaque tour de combat (négatif : ralentit), cumulées avec les autres objets ; déplacement total au moins 1. Vide = 0."
