                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "DodgeArtifactEffect"
            label: "Passif : esquive (%)"
            widget: "object"
            hint: "Chance d'esquiver chaque attaque, ajoutée à celle de l'armure (total plafonné)."
            fields:
