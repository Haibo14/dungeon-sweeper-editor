  - name: "player"
    label: "Joueur"
    description: "Réglages du personnage (format : docs/data.md du dépôt du jeu) : un seul fichier, data/player/player.json."
    format: "json"
    files:
      - name: "player"
        label: "Réglages du joueur"
        file: "data/player/player.json"
        fields:
          - name: "max_health"
            label: "PV max"
            widget: "number"
            value_type: "int"
            min: 1
            max: 99
            step: 1
            required: true
            hint: "1 point = un demi-cœur. Toujours écrit (défaut du script : 3)."
          - name: "reveal_range"
            label: "Portée de révélation"
            widget: "number"
            value_type: "float"
            min: 1
            max: 20
            step: 0.1
            required: true
            hint: "En cases, en ligne droite entre les centres (une diagonale vaut 1,41). Toujours écrite (défaut du script : 2)."
          - name: "attack"
            label: "Attaque à mains nues"
            widget: "object"
            required: false
            collapsed: false
            hint: "Ce que fait le personnage à chaque tour de combat sans arme ; une arme équipée la remplace. Vide = le personnage n'attaque pas."
            fields:
              - name: "display_name"
                label: "Nom de l'attaque"
                widget: "string"
                required: false
                hint: "Vide = \"Attack\"."
              - name: "effects"
                label: "Effets de l'attaque"
                label_singular: "Effet"
                widget: "list"
                required: false
                hint: "Appliqués dans l'ordre à chaque coup."
                typeKey: "type"
                types:
                  - name: "DamageEffect"
                    label: "Dégâts"
                    widget: "object"
                    hint: "Retire des PV à la cible (plus la force du porteur et les bonus de dégâts)."
                    fields:
                      - name: "amount"
                        label: "Montant"
                        widget: "number"
                        value_type: "int"
                        min: 1
                        max: 99
                        step: 1
                        required: false
                        hint: "Nombre de PV, de charges… Vide = 1."
                  - name: "HealEffect"
                    label: "Soin"
                    widget: "object"
                    hint: "Rend des PV au porteur, sans dépasser son maximum."
                    fields:
                      - name: "amount"
                        label: "Montant"
                        widget: "number"
                        value_type: "int"
                        min: 1
                        max: 99
                        step: 1
                        required: false
                        hint: "Nombre de PV, de charges… Vide = 1."
                  - name: "StrengthEffect"
                    label: "Force"
                    widget: "object"
                    hint: "Donne des charges de force au porteur : +1 dégât par charge à chaque coup, jusqu'à la fin du combat."
                    fields:
                      - name: "amount"
                        label: "Montant"
                        widget: "number"
                        value_type: "int"
                        min: 1
                        max: 99
                        step: 1
                        required: false
                        hint: "Nombre de PV, de charges… Vide = 1."
                  - name: "WeaknessEffect"
                    label: "Faiblesse"
                    widget: "object"
                    hint: "Donne des charges de faiblesse à la cible : +1 dégât subi par charge à chaque coup, jusqu'à la fin du combat."
                    fields:
                      - name: "amount"
                        label: "Montant"
                        widget: "number"
                        value_type: "int"
                        min: 1
                        max: 99
                        step: 1
                        required: false
                        hint: "Nombre de PV, de charges… Vide = 1."
          - name: "attack_range"
            label: "Portée d'attaque"
            widget: "number"
            value_type: "int"
            min: 1
            max: 10
            step: 1
            required: true
            hint: "En cases : 1 = les 8 cases autour, au-delà comptée sans diagonales ; remplacée par celle d'une arme équipée. Toujours écrite (défaut du script : 1)."
          - name: "movement"
            label: "Déplacement"
            widget: "number"
            value_type: "int"
            min: 1
            max: 10
            step: 1
            required: true
            hint: "Cases parcourues par tour de combat, diagonales comprises. Toujours écrit (défaut du script : 2)."
