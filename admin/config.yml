        public_folder: "/assets/icons/sprites/dungeon_tileset_ii"
        choose_url: false
        accept: "image/png"
        hint: "Animations du monstre (idle et run), choisies par leur aperçu : une des 22 images de assets/icons/sprites/dungeon_tileset_ii/ (première image de l'animation idle, découpées par build_icons.gd ; big_demon, big_zombie et ogre sont les grands, pour un boss 2 × 2). Ne pas en ajouter ici : elles viennent de l'atlas. C'est aussi l'apparence du boss qui se bat avec ce monstre. Vide = dessiné comme un « M »."
