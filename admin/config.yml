          - name: "ParryArtifactEffect"
            label: "Passif : parade (%)"
            widget: "object"
            hint: "Chance de parer chaque attaque, ajoutée à celle de l'arme (total plafonné)."
            fields:
              - name: "amount"
                label: "Chance (%)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 100
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "FirstHitArtifactEffect"
            label: "Passif : premier coup"
            widget: "object"
            hint: "Dégâts en plus du premier coup de chaque combat (pas ses ricochets, éclaboussures ni écho)."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "MonsterWeaknessArtifactEffect"
            label: "Passif : faiblesse des monstres"
            widget: "object"
            hint: "Charges de faiblesse de chaque monstre au début de chaque combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "HealOnKillArtifactEffect"
            label: "Passif : soin par monstre tué"
            widget: "object"
            hint: "PV rendus pour chaque monstre tué en combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "StrengthPerHitTakenArtifactEffect"
            label: "Passif : force par coup reçu"
            widget: "object"
            hint: "Charges de force gagnées chaque fois qu'une attaque de monstre touche, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "SurpriseShieldArtifactEffect"
            label: "Passif : bouclier si surpris"
            widget: "object"
            hint: "Points de bouclier quand un monstre ouvre le combat par surprise, avant son attaque."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "ExtraStrikesArtifactEffect"
            label: "Passif : attaques en plus"
            widget: "object"
            hint: "Attaques par tour ajoutées à celles de l'arme."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "StrengthPerStrikeArtifactEffect"
            label: "Passif : force par attaque"
            widget: "object"
            hint: "Charges de force gagnées après chaque attaque du personnage, jusqu'à la fin du combat."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "GoldDamageArtifactEffect"
            label: "Passif : dégâts selon l'or"
            widget: "object"
            hint: "Dégâts en plus à chaque coup par tranche d'or possédée."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
              - name: "gold_step"
                label: "Tranche d'or"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9999
                step: 1
                required: false
                default: 100
                hint: "Or par tranche. Vide = 100."
          - name: "ReviveArtifactEffect"
            label: "Passif : résurrection"
            widget: "object"
            hint: "Une fois dans la partie, à 0 PV, le personnage revient avec la moitié de ses PV max ; l'artéfact se brise."
            fields: []
          - name: "RevealRangeArtifactEffect"
            label: "Donjon : portée de révélation"
            widget: "object"
            hint: "Cases ajoutées à la portée de révélation."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "TrapDamageReductionArtifactEffect"
            label: "Donjon : dégâts des pièges réduits"
            widget: "object"
            hint: "Retirés de chaque piège qui se déclenche, sans descendre sous 1 dégât."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "TrapAvoidArtifactEffect"
            label: "Donjon : pièges évités (%)"
            widget: "object"
            hint: "Chance qu'un piège révélé ne se déclenche pas."
            fields:
              - name: "amount"
                label: "Chance (%)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 100
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "GoldPerDisarmedTrapArtifactEffect"
            label: "Donjon : or par piège désarmé"
            widget: "object"
            hint: "Or qui peut être reçu pour chaque piège désarmé (drapeau et entouré) : le montant, avec la chance donnée."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 999
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
              - name: "chance"
                label: "Chance (%)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 100
                step: 1
                required: false
                default: 100
                hint: "Chance de recevoir le montant à chaque piège désarmé. Vide = 100 (toujours)."
          - name: "ShopDiscountArtifactEffect"
            label: "Donjon : remise du marchand (%)"
            widget: "object"
            hint: "Pourcentage retiré des prix (total plafonné)."
            fields:
              - name: "amount"
                label: "Remise (%)"
                widget: "number"
                value_type: "int"
                min: 1
                max: 100
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "ExtraChestRewardsArtifactEffect"
            label: "Donjon : récompenses en plus"
            widget: "object"
            hint: "Récompenses ajoutées au coffre de chaque salle des coffres."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "HealOnRoomClearedArtifactEffect"
            label: "Donjon : soin par salle terminée"
            widget: "object"
            hint: "PV rendus à chaque salle terminée."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 99
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "TrapsFlaggedArtifactEffect"
            label: "Donjon : pièges marqués à l'entrée"
            widget: "object"
            hint: "Pièges cachés marqués d'un drapeau au hasard en entrant pour la première fois dans une salle."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
          - name: "MonstersFlaggedArtifactEffect"
            label: "Donjon : monstres marqués à l'entrée"
            widget: "object"
            hint: "Monstres cachés marqués d'un drapeau au hasard en entrant pour la première fois dans une salle."
            fields:
              - name: "amount"
                label: "Montant"
                widget: "number"
                value_type: "int"
                min: 1
                max: 9
                step: 1
                required: false
                default: 1
                hint: "Vide = 1."
  - name: "dungeon"
    label: "Donjon"
    description: "Réglages du donjon (format : docs/data.md du dépôt du jeu) : un seul fichier, data/dungeon/dungeon.json."
    format: "json"
    files:
      - name: "dungeon"
        label: "Réglages du donjon"
        file: "data/dungeon/dungeon.json"
        fields:
          - name: "design_notes"
            label: "À implémenter"
            widget: "text"
            required: false
            hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
          - name: "level_count"
            label: "Nombre d'étages"
            widget: "number"
            value_type: "int"
            min: 0
            max: 100
            step: 1
            required: false
            default: 3
            hint: "La partie est gagnée une fois le dernier étage fini (son boss vaincu, ou toutes ses salles terminées s'il n'en a pas). 0 = donjon sans fin. Vide = 3."
          - name: "levels"
            label: "Étages"
            label_singular: "Étage"
            widget: "list"
            required: true
            hint: "Réglages de chaque étage, le premier en haut. Les étages au-delà de la liste reprennent le dernier."
            field:
              name: "level"
              label: "Étage"
              widget: "select"
              options:
                - label: "level_1"
                  value: "levels/level_1"
                - label: "level_2"
                  value: "levels/level_2"
                - label: "level_3"
                  value: "levels/level_3"
                - label: "level_4"
                  value: "levels/level_4"
                - label: "level_5"
                  value: "levels/level_5"
          - name: "hazard_types"
            label: "Dangers par défaut"
            label_singular: "Danger"
            widget: "list"
            required: false
            hint: "Seulement pour un étage sans sa propre liste de dangers (aucun aujourd'hui), tirés selon leur poids hors liste d'étage. Vide = tous les pièges puis tous les monstres. Choix tenus à la main dans la config de l'éditeur : un nouveau piège ou monstre n'y est pas avant sa mise à jour."
            field:
              name: "hazard"
              label: "Danger"
              widget: "select"
              options:
                - label: "Piège : Blade trap"
                  value: "traps/blade_trap"
                - label: "Piège : Blinding Flash"
                  value: "traps/blinding_flash"
                - label: "Piège : Fire trap"
                  value: "traps/fire_trap"
                - label: "Piège : Glue trap"
                  value: "traps/glue_trap"
                - label: "Piège : Shield break trap"
                  value: "traps/shield_break_trap"
                - label: "Piège : Spike trap"
                  value: "traps/spike_trap"
                - label: "Monstre : Chort"
                  value: "monsters/chort"
                - label: "Monstre : Doc"
                  value: "monsters/doc"
                - label: "Monstre : Goblin"
                  value: "monsters/goblin"
                - label: "Monstre : Ice Zombie"
                  value: "monsters/ice_zombie"
                - label: "Monstre : Imp"
                  value: "monsters/imp"
                - label: "Monstre : Masked Orc"
                  value: "monsters/masked_orc"
                - label: "Monstre : Muddy"
                  value: "monsters/muddy"
                - label: "Monstre : Necromancer"
                  value: "monsters/necromancer"
                - label: "Monstre : Orc Shaman"
                  value: "monsters/orc_shaman"
                - label: "Monstre : Orc Warrior"
                  value: "monsters/orc_warrior"
                - label: "Monstre : Skeleton"
                  value: "monsters/skeleton"
                - label: "Monstre : Slug"
                  value: "monsters/slug"
                - label: "Monstre : Swampy"
                  value: "monsters/swampy"
                - label: "Monstre : Tiny Slug"
                  value: "monsters/tiny_slug"
                - label: "Monstre : Tiny Zombie"
                  value: "monsters/tiny_zombie"
                - label: "Monstre : Wogol"
                  value: "monsters/wogol"
                - label: "Monstre : Zombie"
                  value: "monsters/zombie"
          - name: "monster_chance"
            label: "Chance de monstre (%)"
            widget: "number"
            value_type: "float"
            min: 0
            max: 100
            step: 0.1
            required: false
            default: 65.0
            hint: "Chance qu'une case de danger porte un monstre plutôt qu'un piège, sur chaque étage ; les poids de l'étage choisissent ensuite lequel. Vide = 65."
          - name: "loot_items"
            label: "Équipement des marchands et salles des coffres"
            label_singular: "Objet"
            widget: "list"
            required: false
            hint: "Pour les étages sans leur propre liste. Références « equipment/weapons/<id> » ou « equipment/armors/<id> ». Vide = tout l'équipement du jeu (une nouvelle arme y entre d'elle-même)."
            field:
              name: "item"
              label: "Objet"
              widget: "string"
          - name: "artifacts"
            label: "Artéfacts proposés"
            label_singular: "Artéfact"
            widget: "list"
            required: false
            hint: "Proposés en fin d'étage, tirés par rareté ; ceux déjà possédés jamais. Vide = tous les artéfacts du jeu (un nouvel artéfact y entre de lui-même)."
            field:
              name: "artifact"
              label: "Artéfact"
              widget: "relation"
              collection: "artifacts"
              value_field: "artifacts/{{slug}}"
              display_fields:
                - "display_name"
              dropdown_threshold: 0
          - name: "artifact_choices"
            label: "Artéfacts au choix"
            widget: "number"
            value_type: "int"
            min: 0
            max: 10
            step: 1
            required: false
            default: 3
            hint: "Artéfacts proposés au choix à la fin de chaque étage (moins s'il n'en reste pas assez). 0 = aucun. Vide = 3."
          - name: "bosses"
            label: "Boss"
            label_singular: "Boss"
            widget: "list"
            required: false
            hint: "Boss du donjon : chaque étage dont un boss donne le numéro (« Étage » du boss) a sa salle de boss. Vide = tous les boss du jeu (un nouveau boss y entre de lui-même)."
            field:
              name: "boss"
              label: "Boss"
              widget: "relation"
              collection: "bosses"
              value_field: "bosses/{{slug}}"
              display_fields:
                - "display_name"
              dropdown_threshold: 0
          - name: "equipment_prices"
            label: "Prix de l'équipement"
            widget: "select"
            required: false
            hint: "Prix d'achat et de vente par rareté (collection « Prix »). Vide = prix par défaut du script."
            options:
              - label: "equipment_prices"
                value: "prices/equipment_prices"
  - name: "potions"
    label: "Potions"
    label_singular: "Potion"
    description: "Potions du jeu : un fichier JSON par potion (format : docs/data.md du dépôt du jeu). Une nouvelle potion n'apparaît que dans les récompenses et chez les marchands des étages qui la listent : l'ajouter aux choix de « Potion » des étages dans config.yml."
    folder: "data/potions"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "display_name"
    summary: "{{display_name}}"
    fields:
      - name: "design_notes"
        label: "À implémenter"
        widget: "text"
        required: false
        hint: "Ce que les effets existants ne savent pas faire, en langage naturel (« brûle la cible 2 tours, 1 dégât par tour »). Jamais lu par le jeu : Claude le lit avec /implement-pending, puis vide le champ une fois implémenté."
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
        required: false
        default: false
        hint: "Coché : chargé et vérifié, mais absent du jeu (butin, dangers, artéfacts) jusqu'à son implémentation. Seul un autre brouillon peut y faire référence (un étage ne peut pas lister un monstre brouillon)."
      - name: "display_name"
        label: "Nom"
        widget: "string"
        required: true
        hint: "Nom affiché en jeu. Donne aussi le nom du fichier d'une nouvelle potion (« Potion verte » → potion_verte.json)."
      - name: "texture"
        label: "Icône"
        widget: "image"
        required: false
        media_folder: "/assets/icons/potions"
        public_folder: "/assets/icons/potions"
        choose_url: false
        accept: "image/png"
        hint: "Une des 10 icônes de assets/icons/potions/ (découpées de atlas_potions-32x32.png par build_icons.gd). Une nouvelle icône s'ajoute à l'atlas dans le dépôt du jeu (docs/assets.md), pas ici."
      - name: "heal"
        label: "Soin"
        widget: "number"
        value_type: "int"
        min: 0
        max: 99
        step: 1
        required: false
        default: 0
