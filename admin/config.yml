        required: false
        hint: "Biomes possibles pour les salles de l'étage, avec leur poids. L'étage en tire entre le min et le max (chacun au plus une fois), chaque biome tiré reçoit au moins une salle, puis chaque autre salle prend l'un d'eux. Les pièges et monstres d'une salle sont ceux de son biome."
